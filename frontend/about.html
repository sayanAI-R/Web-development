<!DOCTYPE html> <!--اعلام نوع سند-->
<html> <!--ریشه و والد تمام محتوای سند-->

<head> <!--طلاعات و تنظیمات صفحه--> 

    <title>sayan</title> <!--عنوان صفحه که در تب مرورگر نمایش داده -->
    <meta> <!--برای تعیین اطلاعاتی مثل کدکذاری کاراکترهاوتوضیحات صفحه و تنظیم نمایش در موبایل-->
    <style></style> <!--برای  نوشتن css داخل خود فایل -->
    <link> <!--برای اتصال فایل های خارجی، به خصوص فایل css ، روش فایل خارجی-->
    <script></script> <!--برای نوشتن یا اتصال js-->
    <base>  <!--برای تعیین آدرس پایه لینک نسبی در صفحه -->

</head>


<body> <!--محتوای قابل مشاهده صفحه-->

<!--Semantic HTML-->
    <header></header> <!--سربرگ سایت-->
    <section></section> <!--بخش بندی محتوا-->
    <nav></nav> <!--ناوی ناوبری-->
    <main></main> <!--محتوای اصلی صفحه-->
    <aside></aside> <!--محتوای جانبی-->
    <article></article> <!--محتوای مستقل مثل مقاله-->
    <div></div> <!--ظرف عمومی برای گروه بندی عناصر-->
    <footer></footer> <!--پاورقی سایت-->
<!--تگ های متنی--> 
    <h1>hello</h1><br> <!-- ..<h6></h6>-->
    <p>hello</p><br><!--پاراگراف-->
    <span>hello</span><br> <!--گروه بندی بخشی از متن-->
    <strong>hello</strong><br> <!--اهمیت معنایی و تاکید قوی-->
    <em>hello</em><br> <!--تاکید معنایی-->
    <b>hello</b><br> <!--برجسته کردن ظاهری متن -->
    <i>hello</i><br> <!--نمایش متن حالت متمایز-->
    <br> <!--رفتن به خط بعدی-->
    <hr><br> <!--ایجاد جداکننده موضوعی-->
    <blockquote>hello</blockquote><br> <!--نقل قول بلند-->
    <code>hello</code><br> <!--نمایش قطعه کد--> 
<!--تگ های لینک و رسانه-->
    <a></a> <!--ایجاد لینک-->
    <img> <!--نمایش تصویر-->
    <video></video> <!--نمایش ویدئو-->
    <audio></audio> <!--پخش صدا-->
    <source> <!--معرفی منبع رسانه-->
    <iframe></iframe> <!--نمایش یک صفحه یا محتوای خارجی-->
    <picture></picture> <!--ارائه نسحه های مختلف تصویر-->
    <figure></figure> <!--گروه بندی تصویر یا محتوای مستقل-->
    <figcaption></figcaption> <!--توضیح تصویر-->
<!--تگ های لیست-->
    <ul></ul> <!--لیست بدون ترتیب-->
    <ol></ol> <!--لیست شماره دار-->
    <li></li> <!--هر آیتم لیست -->
    <dl></dl> <!--لیست توضیحی-->
    <dt></dt> <!--عنوان مورد-->
    <dd></dd> <!--توضیح مورد-->
<!--تگ های فرم-->
    <form></form> <!--ساخت فرم-->
    <input> <!--دریافت ورودی-->
    <label></label> <!--برچسب ورودی-->
    <textarea></textarea> <!--ورودی متن چند خطی-->
    <button></button> <!--دکمه-->
    <select></select> <!--منوی انتخاب-->
    <option value=""></option> <!--گزینه انتخاب-->
    <fieldset></fieldset> <!--گروه بندی فیلد-->
    <legend></legend> <!--عنوان گروه فیلدها-->
<!--تگ های جدول-->
    <table></table> <!--جدول-->
    <tr></tr> <!--ردیف-->
    <th></th> <!--سلول عنوان-->
    <td></td> <!--سلول داده-->
    <thead></thead> <!--بخش سربرگ جدول-->
    <tbody></tbody> <!--بخش اصلی جدول-->
    <tfoot></tfoot> <!--بخش پایانی جدول-->
    <caption></caption> <!--عنوان جدول-->

</body>


</html>
